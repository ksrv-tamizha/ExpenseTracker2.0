<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Expenses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Poppins', sans-serif; 
      background-color: #f4f7f6; 
      padding-top: 30px; 
      padding-bottom: 40px; 
    }
    .card { 
      border: none; 
      border-radius: 16px; 
      box-shadow: 0 8px 30px rgba(0,0,0,0.04); 
      background: white;
    }
    h2.title {
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: -0.5px;
    }
    /* Fixed Navigation for Mobile */
    .nav-pills { flex-wrap: nowrap; gap: 4px; }
    .nav-pills .nav-link { 
      border-radius: 30px; 
      padding: 8px 5px; 
      color: #7f8c8d; 
      font-weight: 500; 
      font-size: 0.85rem;
      text-align: center;
      flex: 1; /* Distributes width evenly */
      white-space: nowrap;
      transition: all 0.3s ease; 
    }
    .nav-pills .nav-link:hover { background-color: #ecf0f1; }
    .nav-pills .nav-link.active { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white; 
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4); 
    }
    .btn-primary { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
      border: none; 
      border-radius: 12px; 
      font-weight: 600; 
      padding: 12px; 
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4); 
    }
    .btn-outline-primary {
      border-radius: 8px;
      font-weight: 500;
    }
    .form-control, .form-select { 
      border-radius: 10px; 
      padding: 12px 15px; 
      border: 1px solid #dfe6e9; 
      background-color: #fcfcfc;
    }
    .form-control:focus, .form-select:focus { 
      box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25); 
      border-color: #4facfe; 
    }
    .table-custom { 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #f1f2f6;
    }
    .table-custom thead { 
      background-color: #f8f9fa; 
      color: #2c3e50; 
      font-weight: 600;
    }
    .table-custom td { vertical-align: middle; }
    .total-wrapper {
      background: linear-gradient(135deg, #fffcf9 0%, #fff 100%);
      border: 1px solid #fef0e6;
      border-radius: 16px;
      padding: 30px;
    }
    .total-badge { 
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      font-weight: 700; 
      font-size: 3.5rem; 
      margin-bottom: 0;
    }
    .modal-content { border-radius: 16px; border: none; }
    .modal-header { border-bottom: 1px solid #f1f2f6; }
    .btn-danger-custom {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      border: none;
      color: white;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px;
    }
    .btn-danger-custom:hover {
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 750px;">
    <div class="text-center mb-5">
      <h2 class="title"><i class="bi bi-wallet2 text-primary"></i> Office Expenses</h2>
      <p class="text-muted">Manage and track your pending payments</p>
    </div>
    
    <!-- Navigation -->
    <ul class="nav nav-pills d-flex w-100 justify-content-between mb-4 pb-2">
      <li class="nav-item">
        <a class="nav-link active" id="btn-enter" onclick="switchView('enter')"><i class="bi bi-plus-circle me-1"></i> Enter</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="btn-dash" onclick="switchView('dash')"><i class="bi bi-pie-chart me-1"></i> Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="btn-tracker" onclick="switchView('tracker')"><i class="bi bi-list-ul me-1"></i> Tracker</a>
      </li>
    </ul>

    <!-- Enter Expense View -->
    <div id="view-enter" class="card p-4 p-md-5 fade-in">
      <form id="expenseForm" onsubmit="submitExpense(event)">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted fw-semibold">Date</label>
            <input type="date" id="date" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted fw-semibold">Category</label>
            <select id="category" class="form-select" required>
              <option value="">Loading categories...</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted fw-semibold">Particular</label>
          <input type="text" id="particular" class="form-control" placeholder="What was this expense for?" required>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted fw-semibold">Amount (₹)</label>
          <input type="number" id="amount" class="form-control" placeholder="0" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
          <i class="bi bi-check-circle me-1"></i> Submit Expense
        </button>
      </form>
      <div id="statusMessage" class="mt-3 text-center fw-medium"></div>
    </div>

    <!-- Dashboard View -->
    <div id="view-dash" class="card p-4 p-md-5" style="display: none;">
      <div class="text-center mb-5 total-wrapper">
        <h5 class="text-muted fw-semibold mb-2">Total Pending</h5>
        <h2 id="totalPending" class="total-badge">₹0</h2>
      </div>
      
      <h5 class="mb-3 fw-semibold text-secondary"><i class="bi bi-grid me-2"></i>Split by Category</h5>
      <div class="table-responsive mb-4 table-custom">
        <table class="table table-borderless mb-0 table-hover">
          <thead class="border-bottom">
            <tr>
              <th class="py-3 px-4">Category</th>
              <th class="py-3 px-4 text-end">Amount</th>
            </tr>
          </thead>
          <tbody id="categoryTableBody">
            <tr><td colspan="2" class="text-center py-4 text-muted">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-light w-100 fw-semibold text-secondary" onclick="loadDashboardData()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh Dashboard
      </button>
    </div>

    <!-- Tracker View -->
    <div id="view-tracker" class="card p-4 p-md-5" style="display: none;">
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label text-muted fw-semibold small">Start Date</label>
          <input type="date" id="filterStart" class="form-control form-control-sm">
        </div>
        <div class="col-6">
          <label class="form-label text-muted fw-semibold small">End Date</label>
          <input type="date" id="filterEnd" class="form-control form-control-sm">
        </div>
      </div>
      <button class="btn btn-light w-100 mb-4 fw-semibold text-secondary" onclick="filterTracker()">
        <i class="bi bi-funnel me-1"></i> Apply Filter
      </button>
      
      <div class="table-responsive table-custom">
        <table class="table table-borderless table-hover mb-0">
          <thead class="border-bottom">
            <tr>
              <th class="py-3 px-2">Date</th>
              <th class="py-3 px-2">Particular</th>
              <th class="py-3 px-2">Amount</th>
              <th class="py-3 px-2 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="trackerTableBody">
            <tr><td colspan="4" class="text-center py-4 text-muted">Loading tracker...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Edit Expense Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-2">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" onsubmit="submitEdit(event)">
            <input type="hidden" id="editRowId">
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label text-muted fw-semibold small">Date</label>
                <input type="date" id="editDate" class="form-control" required>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label text-muted fw-semibold small">Category</label>
                <select id="editCategory" class="form-select" required></select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted fw-semibold small">Particular</label>
              <input type="text" id="editParticular" class="form-control" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small">Amount</label>
              <input type="number" id="editAmount" class="form-control" required>
            </div>
            
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-danger-custom flex-grow-1" id="deleteBtn" onclick="submitDelete()">
                <i class="bi bi-trash3"></i> Delete
              </button>
              <button type="submit" class="btn btn-primary flex-grow-1" id="editSubmitBtn">
                <i class="bi bi-save"></i> Save
              </button>
            </div>
          </form>
          <div id="editStatusMessage" class="mt-3 text-center fw-medium"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwRhiDgGNDbJws9GRrkWhnjDos-XEyz8jRTsdy8BBFbP2IIPIJvfaRY-vQdg7Ey_nOc/exec';
    let allTrackerData = [];

    window.onload = function() {
      document.getElementById('date').valueAsDate = new Date();
      loadCategories();
    };

    function switchView(view) {
      document.getElementById('view-enter').style.display = view === 'enter' ? 'block' : 'none';
      document.getElementById('view-dash').style.display = view === 'dash' ? 'block' : 'none';
      document.getElementById('view-tracker').style.display = view === 'tracker' ? 'block' : 'none';
      
      document.getElementById('btn-enter').classList.toggle('active', view === 'enter');
      document.getElementById('btn-dash').classList.toggle('active', view === 'dash');
      document.getElementById('btn-tracker').classList.toggle('active', view === 'tracker');

      if (view === 'dash') loadDashboardData();
      if (view === 'tracker') loadTrackerData();
    }

    function loadCategories() {
      fetch(`${scriptURL}?action=getCategories`)
        .then(response => response.json())
        .then(data => {
          const select = document.getElementById('category');
          const editSelect = document.getElementById('editCategory');
          
          select.innerHTML = '<option value="">Select a category</option>';
          editSelect.innerHTML = '<option value="">Select a category</option>';
          
          data.categories.forEach(cat => {
            const cleanCat = cat.trim(); 
            select.innerHTML += `<option value="${cleanCat}">${cleanCat}</option>`;
            editSelect.innerHTML += `<option value="${cleanCat}">${cleanCat}</option>`;
          });
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('category').innerHTML = '<option value="">Error loading categories</option>';
        });
    }

    function submitExpense(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMessage');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';
      msg.innerText = '';

      const formData = new FormData();
      formData.append('date', document.getElementById('date').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('particular', document.getElementById('particular').value);
      formData.append('amount', document.getElementById('amount').value);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> Logged successfully!</span>';
            document.getElementById('expenseForm').reset();
            document.getElementById('date').valueAsDate = new Date();
          } else {
            msg.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
          }
        })
        .catch(() => {
          msg.innerHTML = '<span class="text-danger">Failed to connect to server.</span>';
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Submit Expense';
          setTimeout(() => { msg.innerText = ''; }, 3000);
        });
    }

    function loadDashboardData() {
      document.getElementById('categoryTableBody').innerHTML = '<tr><td colspan="2" class="text-center py-4 text-muted">Loading data...</td></tr>';
      
      fetch(`${scriptURL}?action=getDashboardData`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('totalPending').innerText = '₹' + data.totalPending.toLocaleString('en-IN');
          const tbody = document.getElementById('categoryTableBody');
          tbody.innerHTML = '';
          
          const categories = Object.keys(data.categorySplit);
          if (categories.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center py-4 text-muted">No pending expenses found.</td></tr>';
            return;
          }

          const sortedCategories = Object.entries(data.categorySplit).sort((a, b) => b[1] - a[1]);

          for (const [category, amount] of sortedCategories) {
            tbody.innerHTML += `
              <tr>
                <td class="px-4 fw-medium text-dark">${category}</td>
                <td class="px-4 text-end fw-semibold text-secondary">₹${amount.toLocaleString('en-IN')}</td>
              </tr>
            `;
          }
        })
        .catch(error => console.error('Error loading dashboard:', error));
    }

    function loadTrackerData() {
      document.getElementById('trackerTableBody').innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Loading tracker...</td></tr>';
      
      fetch(`${scriptURL}?action=getTrackerData`)
        .then(response => response.json())
        .then(data => {
          allTrackerData = data.data; 
          renderTrackerTable(allTrackerData);
        })
        .catch(error => console.error('Error loading tracker:', error));
    }

    function renderTrackerTable(dataArray) {
      const tbody = document.getElementById('trackerTableBody');
      tbody.innerHTML = '';
      
      if (!dataArray || dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No expenses found.</td></tr>';
        return;
      }

      dataArray.forEach(row => {
        let parsedDate = row.date;
        let formattedForEdit = "";
        
        let dateStr = String(row.date);
        if (!/\d{4}/.test(dateStr)) {
          dateStr += ' ' + new Date().getFullYear(); 
        }
        
        let d = new Date(dateStr);
        
        if (!isNaN(d.getTime())) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          formattedForEdit = `${year}-${month}-${day}`;
          parsedDate = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        
        const safeParticular = (row.particular || "").replace(/'/g, "\\'");
        const safeCategory = (row.category || "").toString().trim().replace(/'/g, "\\'");

        tbody.innerHTML += `
          <tr>
            <td class="px-2 text-secondary fw-medium" style="font-size: 0.9rem;">${parsedDate}</td>
            <td class="px-2 text-muted" style="font-size: 0.9rem;">${row.particular}</td>
            <td class="px-2 fw-semibold" style="font-size: 0.9rem;">₹${parseFloat(row.amount).toLocaleString('en-IN')}</td>
            <td class="px-2 text-center">
              <button class="btn btn-sm btn-outline-primary" 
                onclick="openEditModal(${row.rowId}, '${formattedForEdit}', '${safeCategory}', '${safeParticular}', ${row.amount})">
                <i class="bi bi-pencil"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    function filterTracker() {
      const startVal = document.getElementById('filterStart').value;
      const endVal = document.getElementById('filterEnd').value;
      
      if (!startVal && !endVal) {
        renderTrackerTable(allTrackerData);
        return;
      }

      const startDate = startVal ? new Date(startVal + 'T00:00:00') : new Date('1900-01-01');
      const endDate = endVal ? new Date(endVal + 'T23:59:59') : new Date('2100-01-01');

      const filteredData = allTrackerData.filter(row => {
        let rowDateStr = row.date.match(/^\d{4}-\d{2}-\d{2}$/) ? (row.date + 'T12:00:00') : (row.date + ' ' + new Date().getFullYear());
        const rowDate = new Date(rowDateStr);
        return rowDate >= startDate && rowDate <= endDate;
      });

      renderTrackerTable(filteredData);
    }

    function openEditModal(rowId, date, category, particular, amount) {
      document.getElementById('editRowId').value = rowId;
      document.getElementById('editDate').value = date;
      document.getElementById('editParticular').value = particular;
      document.getElementById('editAmount').value = amount;
      
      const catSelect = document.getElementById('editCategory');
      catSelect.value = ""; 
      
      const targetCat = category.toString().trim().toLowerCase();
      
      for (let i = 0; i < catSelect.options.length; i++) {
        const optionText = catSelect.options[i].value.toLowerCase();
        if (optionText === targetCat || (targetCat.includes("station") && optionText.includes("station"))) {
          catSelect.selectedIndex = i;
          break;
        }
      }
      
      var editModal = new bootstrap.Modal(document.getElementById('editModal'));
      editModal.show();
    }

    function submitEdit(e) {
      e.preventDefault();
      const btn = document.getElementById('editSubmitBtn');
      const msg = document.getElementById('editStatusMessage');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
      msg.innerText = '';

      const formData = new FormData();
      formData.append('action', 'edit');
      formData.append('rowId', document.getElementById('editRowId').value);
      formData.append('date', document.getElementById('editDate').value);
      formData.append('category', document.getElementById('editCategory').value);
      formData.append('particular', document.getElementById('editParticular').value);
      formData.append('amount', document.getElementById('editAmount').value);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> Updated!</span>';
            setTimeout(() => {
              bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
              loadTrackerData();
              msg.innerHTML = '';
            }, 1000);
          } else {
            msg.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
          }
        })
        .catch(() => msg.innerHTML = '<span class="text-danger">Failed to connect.</span>')
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-save"></i> Save';
        });
    }

    function submitDelete() {
      if(!confirm("Are you sure you want to permanently delete this expense?")) return;

      const btn = document.getElementById('deleteBtn');
      const msg = document.getElementById('editStatusMessage');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Deleting...';
      msg.innerText = '';

      const formData = new FormData();
      formData.append('action', 'delete');
      formData.append('rowId', document.getElementById('editRowId').value);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            msg.innerHTML = '<span class="text-success"><i class="bi bi-trash"></i> Deleted!</span>';
            setTimeout(() => {
              bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
              loadTrackerData();
              msg.innerHTML = '';
            }, 1000);
          } else {
            msg.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
          }
        })
        .catch(() => msg.innerHTML = '<span class="text-danger">Failed to connect.</span>')
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-trash3"></i> Delete';
        });
    }
  </script>
</body>
</html>
